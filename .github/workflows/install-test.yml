name: Install script

on:
  pull_request:
    paths:
      - 'install.sh'
      - '.github/workflows/install-test.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - '.github/workflows/install-test.yml'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: debian:stable-slim
          - runner: ubuntu-latest
            image: alpine:latest
          - runner: ubuntu-24.04-arm
            image: debian:stable-slim
          - runner: macos-latest
            image: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (Linux, in container)
        if: matrix.image != ''
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" sh -c '
            set -eu
            # Tools the container may lack
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl ca-certificates
            else
              apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
            fi
            VIOLET_VERSION=v0.2.0 VIOLET_NO_MODIFY_PATH=1 sh ./install.sh
            ~/.violet/bin/violet --version
          '

      - name: Smoke test (macOS, host)
        if: matrix.image == ''
        run: |
          VIOLET_VERSION=v0.2.0 VIOLET_NO_MODIFY_PATH=1 sh ./install.sh
          ~/.violet/bin/violet --version
